<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LnMem 人格画像测评工具</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdn.jsdelivr.net/npm/html2canvas"></script></head>
<body class="bg-slate-50 text-slate-800"><div id="app" class="max-w-7xl mx-auto p-6"></div>
<script>
const state={view:'home',mode:'full',provider:'openai',apiKey:'',currentScale:0,currentQ:0,answers:{},debug:false,result:null,generated:[]};
const scales=[{id:'hexaco',name:'HEXACO简化版',time:'约12分钟',theory:'Lee & Ashton (2004)',count:60,likert:5},{id:'ecr',name:'ECR-R简化版',time:'约4分钟',theory:'Brennan et al. (1998)',count:12,likert:5},{id:'motivation',name:'自我效能+动机',time:'约6分钟',theory:'Bandura GSE + SDT',count:24,likert:7},{id:'values',name:'Schwartz价值观',time:'约3分钟',theory:'Schwartz (2012) PVQ-10',count:10,likert:7},{id:'situational',name:'情境化签名',time:'约5分钟',theory:'CAPS',count:14,likert:4}];
const L={5:['非常不同意','不同意','中立','同意','非常同意'],7:['1','2','3','4','5','6','7']};
let Q={hexaco:[],ecr:[],motivation:[],values:[],situational:[]};
async function init(){const names=['hexaco','ecr','motivation','values','situational'];for(const n of names){Q[n]=await fetch(`data/${n}-questions.json`).then(r=>r.json()).catch(()=>[]);}load();render();}
function save(){localStorage.setItem('lnmem_persona_tool',JSON.stringify(state));}
function load(){const s=localStorage.getItem('lnmem_persona_tool');if(s)Object.assign(state,JSON.parse(s));}
function score(){const avg=a=>a.reduce((x,y)=>x+y,0)/Math.max(a.length,1);const n=v=>(v-1)/4;const hex={};for(const d of ['honesty_humility','emotionality','extraversion','agreeableness','conscientiousness','openness']){const items=Q.hexaco.filter(x=>x.dimension===d).map(x=>{let v=state.answers[x.id]||3;if(x.reverse)v=6-v;return n(v)});hex[d]=avg(items);}const anx=avg(Q.ecr.filter(q=>q.dimension==='anxiety').map(q=>n(state.answers[q.id]||3)));const avd=avg(Q.ecr.filter(q=>q.dimension==='avoidance').map(q=>{let v=state.answers[q.id]||3;if(q.reverse)v=6-v;return n(v)}));const attach=(anx<.5&&avd<.5)?'安全型':(anx>=.5&&avd<.5)?'焦虑型':(anx<.5&&avd>=.5)?'回避型':'混乱型';const gse=avg(Q.motivation.filter(q=>q.group==='gse').map(q=>(state.answers[q.id]||4)/7));const topVals=[...Q.values].map(v=>({v:v.value,s:state.answers[v.id]||4})).sort((a,b)=>b.s-a.s);return {hex,attachment:{anxiety:anx,avoidance:avd,style:attach},motivation:{gse,top:topVals.slice(0,2).map(x=>x.v),low:topVals.slice(-2).map(x=>x.v)}}}
function render(){const app=document.getElementById('app');app.innerHTML='';if(state.view==='home'){app.innerHTML=`<div class='bg-white p-6 rounded-xl shadow'><h1 class='text-2xl font-bold mb-2'>LnMem 人格画像测评 + 批量生成工具</h1><p class='text-sm mb-4'>科学量表生成人格锚点，再批量生成虚拟画像用于训练。数据本地保存。</p><div class='grid grid-cols-2 gap-3'><select id='provider' class='border p-2 rounded'><option>openai</option><option>anthropic</option><option>deepseek</option></select><input id='apikey' type='password' class='border p-2 rounded' placeholder='API Key'></div><div class='mt-3'><label><input type='radio' name='mode' value='full' checked> 完整版</label><label class='ml-3'><input type='radio' name='mode' value='fast'> 快速版</label></div><button id='start' class='mt-4 bg-blue-600 text-white px-4 py-2 rounded'>开始测评</button></div>`;document.getElementById('start').onclick=()=>{state.provider=document.getElementById('provider').value;state.apiKey=document.getElementById('apikey').value;state.mode=document.querySelector('input[name=mode]:checked').value;state.view='assessment';save();render();};}
if(state.view==='assessment'){const flow=state.mode==='fast'?['hexaco','ecr','motivation','situational']:['hexaco','ecr','motivation','values','situational'];const sid=flow[state.currentScale];const s=scales.find(x=>x.id===sid);const arr=Q[sid];const q=arr[state.currentQ];if(!q){state.currentScale++;state.currentQ=0;if(state.currentScale>=flow.length){state.result=score();state.view='result';save();return render();}return render();}const all=flow.map(id=>Q[id].length).reduce((a,b)=>a+b,0);const done=Object.keys(state.answers).length;app.innerHTML=`<div class='bg-white rounded-xl shadow p-6'><div class='mb-2 text-sm text-slate-500'>${s.theory} · ${s.count}题 · ${s.time}</div><div class='w-full bg-slate-100 rounded h-3'><div class='bg-blue-500 h-3 rounded' style='width:${Math.round(done/all*100)}%'></div></div><h2 class='text-lg font-semibold mt-4'>${q.scenario||q.text}</h2><div class='mt-4 space-y-2' id='opts'></div><button id='next' class='mt-4 bg-blue-600 text-white px-4 py-2 rounded'>下一题</button></div>`;const opts=document.getElementById('opts');if(q.options){q.options.forEach(o=>opts.innerHTML+=`<label class='block border p-2 rounded'><input type='radio' name='ans' value='${o.key}'> ${o.key}. ${o.text}</label>`);}else{const labels=L[s.likert];labels.forEach((lb,i)=>opts.innerHTML+=`<label class='block border p-2 rounded'><input type='radio' name='ans' value='${i+1}'> ${lb}</label>`);}document.getElementById('next').onclick=()=>{const v=document.querySelector('input[name=ans]:checked');if(!v)return alert('请选择一个选项');state.answers[q.id]=q.options?v.value:+v.value;state.currentQ++;save();render();};}
if(state.view==='result'){const r=state.result;app.innerHTML=`<div id='report' class='bg-white p-6 rounded-xl shadow'><h2 class='text-xl font-bold'>测评结果</h2><div class='grid grid-cols-2 gap-4 mt-3'><canvas id='radar'></canvas><canvas id='values'></canvas></div><div class='mt-3'>依恋类型：<b>${r.attachment.style}</b>（焦虑${r.attachment.anxiety.toFixed(2)} / 回避${r.attachment.avoidance.toFixed(2)}）</div><div class='mt-3 flex gap-2'><button id='exportJson' class='bg-emerald-600 text-white px-3 py-2 rounded'>导出JSON</button><button id='shot' class='bg-slate-700 text-white px-3 py-2 rounded'>导出截图</button><button id='toGen' class='bg-blue-600 text-white px-3 py-2 rounded'>批量生成</button></div></div>`;new Chart(document.getElementById('radar'),{type:'radar',data:{labels:Object.keys(r.hex),datasets:[{label:'HEXACO',data:Object.values(r.hex)}]}});new Chart(document.getElementById('values'),{type:'bar',data:{labels:['top1','top2','low1','low2'],datasets:[{data:[1,.9,.4,.3]}]}});
const profile={profile_id:'boss_self',version:'1.0',created_date:new Date().toISOString().slice(0,10),is_real_person:true,trait_layer:{_theory_basis:'HEXACO 六因素模型 (Lee & Ashton 2004)',hexaco_scores:r.hex},attachment_layer:{_theory_basis:'ECR-R',attachment_dimensions:r.attachment},motivation_layer:{_theory_basis:'GSE+SDT+PVQ',self_efficacy:{general:r.motivation.gse},values_hierarchy:{top_values:r.motivation.top,low_values:r.motivation.low}},raw_assessment_data:state.answers,metadata:{assessment_version:state.mode}};
document.getElementById('exportJson').onclick=()=>download('profile.json',JSON.stringify(profile,null,2));document.getElementById('shot').onclick=()=>html2canvas(document.getElementById('report')).then(c=>download('report.png',c.toDataURL(),'url'));document.getElementById('toGen').onclick=()=>{state.view='generate';save();render();};}
if(state.view==='generate'){app.innerHTML=`<div class='bg-white p-6 rounded-xl shadow'><h2 class='text-xl font-bold'>批量生成虚拟画像</h2><input id='num' type='range' min='1' max='50' value='5' class='w-full'><textarea id='prompt' class='border rounded p-2 w-full h-24 mt-3' placeholder='生成不同年龄职业...'></textarea><button id='gen' class='mt-3 bg-blue-600 text-white px-4 py-2 rounded'>调用 LLM 生成</button><pre class='mt-3 text-xs bg-slate-100 p-3 rounded' id='out'></pre></div>`;document.getElementById('gen').onclick=async()=>{document.getElementById('out').textContent='调用中...';const n=+document.getElementById('num').value;const prompt=document.getElementById('prompt').value;const res=[];for(let i=0;i<n;i++)res.push({profile_id:'virtual_'+(i+1),is_real_person:false,distinguishing_features:['demo'],expected_lnn_behavior:'cluster_'+(i%3)});state.generated=res;document.getElementById('out').textContent=JSON.stringify({count:n,prompt,profiles:res.slice(0,3)},null,2);};}
if(state.debug){app.innerHTML+=`<pre class='fixed bottom-3 right-3 w-96 h-64 overflow-auto bg-black text-green-400 text-xs p-2 rounded'>${JSON.stringify(state,null,2)}</pre>`;}
app.innerHTML+=`<button id='dbg' class='fixed bottom-3 left-3 bg-slate-900 text-white text-xs px-2 py-1 rounded'>Debug</button>`;document.getElementById('dbg').onclick=()=>{state.debug=!state.debug;save();render();};}
function download(name,data,type='text'){const a=document.createElement('a');a.download=name;a.href=type==='url'?data:`data:application/json;charset=utf-8,${encodeURIComponent(data)}`;a.click();}
init();
</script></body></html>
