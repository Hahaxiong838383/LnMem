<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>LnMem 实时大屏 v3</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- Chart.js + Luxon CDN（如被 Brave Shields block 改用本地 /static/vendor/ 路径）-->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"
        onerror="this.dataset.failed='1'"></script>
<script src="https://cdn.jsdelivr.net/npm/luxon@3.5.0/build/global/luxon.min.js"
        onerror="this.dataset.failed='1'"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"
        onerror="this.dataset.failed='1'"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0/dist/chartjs-plugin-annotation.min.js"
        onerror="this.dataset.failed='1'"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100vh; margin: 0; overflow: hidden;
  }
  body {
    padding: 8px 12px;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f172a; color: #e2e8f0;
    display: flex; flex-direction: column;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 4px 6px; border-bottom: 1px solid #1e293b;
    flex: 0 0 auto;  /* 不伸缩 */
  }
  .header h1 { margin: 0; font-size: 15px; font-weight: 600; color: #f1f5f9; }
  .status-bar { display: flex; gap: 8px; font-size: 11px; }
  .status-pill {
    padding: 3px 8px; border-radius: 10px; background: #1e293b;
  }
  .status-pill.ok { background: #064e3b; color: #6ee7b7; }
  .status-pill.warn { background: #78350f; color: #fcd34d; }
  .status-pill.err { background: #7f1d1d; color: #fca5a5; }

  /* 3 图均分剩余空间，纵向 stack */
  .charts-container {
    flex: 1 1 auto;
    display: flex; flex-direction: column;
    gap: 6px;
    margin-top: 6px;
    min-height: 0;  /* 关键：允许 flex 子元素收缩 */
  }
  .chart-section {
    flex: 1 1 0;  /* 3 个 section 等高均分 */
    background: #1e293b; border-radius: 6px;
    padding: 6px 10px;
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .chart-section h2 {
    margin: 0 0 2px; font-size: 12px; font-weight: 500; color: #cbd5e1;
    flex: 0 0 auto;
  }
  .chart-section .caption {
    font-size: 10px; color: #94a3b8; margin: 0 0 4px;
    flex: 0 0 auto;
  }
  .canvas-wrap {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
  }
  canvas {
    background: #0f172a; border-radius: 4px;
    position: absolute; top: 0; left: 0;
    width: 100% !important; height: 100% !important;
  }
  .footer {
    padding: 4px 0 0; border-top: 1px solid #1e293b;
    font-size: 10px; color: #64748b; text-align: center;
    flex: 0 0 auto;
  }
  .footer a { color: #94a3b8; text-decoration: none; margin: 0 6px; }

  /* 调试面板（默认显示最近 4 行）*/
  #debug-panel {
    flex: 0 0 auto;
    max-height: 80px; overflow-y: auto;
    font-size: 10px;
    background:#1e293b;border-left:3px solid #f59e0b;
    padding:6px 10px;margin:4px 0;
    font-family:monospace;color:#fcd34d;
    line-height: 1.4;
  }
  #debug-panel.show { max-height: 160px; }
  #debug-log > div { color: #e2e8f0; }  /* log 每条一行 */

  /* ====== "现在"虚线两侧浮动标签 (HTML overlay, 不依赖 chart.js annotation) ====== */
  /* 川哥 5/26 反馈 chart annotation label 被遮挡，改 HTML overlay 100% 可靠 */
  .now-label {
    position: absolute;
    top: 2px;
    z-index: 10;
    padding: 3px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: bold;
    pointer-events: none;
    white-space: nowrap;
    display: none;        /* 初始隐藏，等 chart 第一次渲染后才显示 */
    transition: left 0.15s, transform 0.15s;
  }
  .now-label.history {
    background: rgba(71, 85, 105, 0.95);
    color: #f1f5f9;
  }
  .now-label.future {
    background: rgba(146, 64, 14, 0.95);
    color: #fff;
    font-style: italic;
  }
</style>
</head>
<body>

<div class="header">
  <h1>🧠 LnMem 实时大屏</h1>
  <div class="status-bar">
    <span id="conn-status" class="status-pill">⏳ 连接中...</span>
    <span id="fps-pill" class="status-pill">0 fps</span>
    <span id="frame-pill" class="status-pill">frame: -</span>
    <span id="chart-updates-pill" class="status-pill">redraws: 0</span>
    <span id="ckpt-pill" class="status-pill">ckpt: -</span>
    <!-- ADR-038 §F4: 时间曲率旋钮 + 双时间轴 (站 1 demo 用) -->
    <span class="status-pill" style="background:#fbbf24;color:#000;font-weight:bold;">
      ⏱ 时间曲率
      <select id="time-warp-select" style="margin-left:6px;padding:2px 6px;background:#000;color:#fbbf24;border:1px solid #fbbf24;border-radius:4px;">
        <option value="1">1× 实时</option>
        <option value="10">10× (~10s/步)</option>
        <option value="100">100× (~1.7min/步)</option>
      </select>
    </span>
    <span id="warp-state-pill" class="status-pill" style="display:none;background:#f87171;color:#000;font-weight:bold;">
      ⚠️ RL 反馈窗口已暂停 (cognitive 反馈污染防护)
    </span>
    <span id="sim-time-pill" class="status-pill" style="display:none;">
      模拟时间: <span id="sim-time-val">-</span>
    </span>
  </div>
</div>

<!-- 调试面板：默认显示最近 4 行，警告/错误时自动撑开 -->
<div id="debug-panel">
  <div style="color:#fcd34d;font-weight:bold;">🔍 调试日志（最近 30 条）：</div>
  <div id="debug-log"></div>
</div>

<div class="charts-container">
  <div class="chart-section">
    <h2>🎯 意图概率（红虚线 = 现在 · 黄色 = LTC 预测）</h2>
    <div class="canvas-wrap">
      <canvas id="intent-chart"></canvas>
      <div class="now-label history" data-for="intent-chart">← 历史</div>
      <div class="now-label future" data-for="intent-chart">🔮 LTC 预测 →</div>
    </div>
  </div>

  <div class="chart-section">
    <h2>😊 情绪（正向 / 负向 / 中立）</h2>
    <div class="canvas-wrap">
      <canvas id="emotion-chart"></canvas>
      <div class="now-label history" data-for="emotion-chart">← 历史</div>
      <div class="now-label future" data-for="emotion-chart">🔮 LTC 预测 →</div>
    </div>
  </div>

  <div class="chart-section">
    <h2>🎯 注意力（专注 / 分心 / 疲惫 / 低能量 / 过渡）</h2>
    <div class="canvas-wrap">
      <canvas id="attention-chart"></canvas>
      <div class="now-label history" data-for="attention-chart">← 历史</div>
      <div class="now-label future" data-for="attention-chart">🔮 LTC 预测 →</div>
    </div>
  </div>
</div>

<div class="footer">
  SSE 1Hz · ADR-034 · <a href="http://localhost:8520" target="_blank">📊 Streamlit</a> · <a href="javascript:location.reload()">🔄 刷新</a>
</div>

<script>
// ====== 调试日志（页面顶部显示）======
function dlog(msg, level = 'info') {
  const el = document.getElementById('debug-log');
  if (!el) { console.log(msg); return; }
  const colors = { info: '#e2e8f0', ok: '#6ee7b7', warn: '#fcd34d', err: '#fca5a5' };
  const ts = new Date().toLocaleTimeString();
  // 每条 log 一个 div 独占一行（不是 span 横向拼）
  const line = document.createElement('div');
  line.style.color = colors[level] || colors.info;
  line.textContent = `[${ts}] ${msg}`;
  el.appendChild(line);
  // 保留最近 30 行
  while (el.children.length > 30) el.removeChild(el.firstChild);
  // 自动滚到底
  const panel = document.getElementById('debug-panel');
  if (panel) panel.scrollTop = panel.scrollHeight;
  console.log(`[${level}]`, msg);
  // 有错警告自动撑开
  if (level === 'err' || level === 'warn') {
    panel?.classList.add('show');
  }
}
window.onerror = function(msg, src, line, col, err) {
  dlog(`❌ JS ERROR: ${msg} @ ${src}:${line}`, 'err');
  return false;
};

dlog('页面加载，开始检查依赖...');

// 检查 CDN 库是否加载成功
if (typeof Chart === 'undefined') {
  dlog('❌ Chart.js CDN 未加载（可能 Brave Shields 拦截）', 'err');
  dlog('💡 临时解决：浏览器 Shields 图标 → 关闭 / 或换 Chrome 试', 'warn');
  throw new Error('Chart.js missing');
} else {
  dlog(`✅ Chart.js v${Chart.version || '?'} 已加载`, 'ok');
}
if (typeof luxon === 'undefined') {
  dlog('⚠️ luxon 未加载，X 轴时间格式可能不对', 'warn');
} else {
  dlog('✅ luxon 已加载', 'ok');
}

// ====== 配置 ======
const SSE_URL = '/signals/stream';
const HISTORY_FRAMES = 60;      // 滑窗：保留最近 N 帧历史
const PRED_FRAMES = 10;          // 显示 N 步预测
const STATE_META = {
  emotional_positive: { group: 'emotion', label: '😊 情绪-正向', color: '#10b981' },
  emotional_negative: { group: 'emotion', label: '😟 情绪-负向', color: '#ef4444' },
  neutral:            { group: 'emotion', label: '😐 中立',     color: '#9ca3af' },
  focused:            { group: 'attention', label: '🎯 专注',   color: '#3b82f6' },
  distracted:         { group: 'attention', label: '🌀 分心',   color: '#f59e0b' },
  fatigued:           { group: 'attention', label: '😴 疲惫',   color: '#a78bfa' },
  low_energy:         { group: 'attention', label: '🪫 低能量', color: '#6b7280' },
  transitioning:      { group: 'attention', label: '🔄 过渡中', color: '#ec4899' },
};
const STATE_ORDER = ['low_energy','focused','distracted','fatigued',
                     'emotional_positive','emotional_negative','neutral','transitioning'];
const INTENT_META = {
  positive: { label: '🟢 正反馈', color: '#10b981' },
  negative: { label: '🔴 负反馈', color: '#ef4444' },
  none:     { label: '⚪ 中性',   color: '#9ca3af' },
};

// ====== 数据结构 ======
const dataBuf = {
  history: [],      // [{ts_ns, state_probs, intent_probs}]
  predictions: [],  // [{ts_ns, state_probs, intent_probs}] (来自 LTC)
};

// 注册 annotation plugin
// chartjs-plugin-annotation v3 UMD build 全局名是 'chartjs-plugin-annotation'（连字符）或自动注册
if (typeof Chart !== 'undefined') {
  // 候选全局名（不同打包版本不同）
  const annotationPlugin =
    window['chartjs-plugin-annotation'] ||
    window['chartjsPluginAnnotation'] ||
    window.Annotation ||
    null;
  if (annotationPlugin) {
    try {
      Chart.register(annotationPlugin);
      dlog('✅ annotation plugin 手动注册成功', 'ok');
    } catch (e) {
      dlog(`⚠️ annotation register 失败: ${e.message}`, 'warn');
    }
  } else {
    // 看是否已自动注册（v3 UMD 自包含注册）
    const registered = Chart.registry?.plugins?.get?.('annotation');
    if (registered) {
      dlog('✅ annotation plugin 已自动注册', 'ok');
    } else {
      // 列 window 上所有 chart 相关键，方便诊断
      const candidates = Object.keys(window).filter(k => /annot|chart/i.test(k));
      dlog(`⚠️ annotation 未找到，window 上找到: ${candidates.join(', ') || '(none)'}`, 'warn');
    }
  }
}

// ====== Chart 工厂 ======
function makeStackedChart(ctxId, datasets, yMax = 1.0) {
  const ctx = document.getElementById(ctxId).getContext('2d');
  return new Chart(ctx, {
    type: 'line',
    data: { datasets },
    options: {
      animation: false,           // 关动画 = 平滑（每帧 update 不闪）
      responsive: true,
      maintainAspectRatio: false,
      // 顶部留 22px 给"← 历史 | 🔮 LTC 预测 →"label（位于"现在"虚线正上方）
      layout: { padding: { top: 22 } },
      plugins: {
        legend: {
          position: 'left',
          align: 'center',
          labels: {
            color: '#cbd5e1',
            font: { size: 11 },
            boxWidth: 14,
            padding: 8,
          },
        },
        tooltip: { mode: 'index', intersect: false },
        annotation: {
          annotations: {
            // 占位，每次 update 时由 setNowAnnotation() 填充
          }
        },
      },
      scales: {
        x: {
          type: 'time',
          time: { displayFormats: { second: 'HH:mm:ss', minute: 'HH:mm' } },
          ticks: { color: '#94a3b8', font: { size: 10 } },
          grid: { color: '#1e293b' },
        },
        y: {
          beginAtZero: true, max: yMax, stacked: true,
          ticks: { color: '#94a3b8', font: { size: 10 },
                   callback: (v) => (v*100).toFixed(0) + '%' },
          grid: { color: '#1e293b' },
        },
      },
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
    },
  });
}

function makeDatasets(stateNames) {
  return stateNames.map((name) => {
    const isIntent = name in INTENT_META;
    const meta = isIntent ? INTENT_META[name] : STATE_META[name];
    return {
      label: meta.label,
      backgroundColor: meta.color + 'cc',
      borderColor: meta.color,
      borderWidth: 1,
      fill: true,
      tension: 0.2,
      pointRadius: 0,
      data: [],
    };
  });
}

// ====== 实例化 ======
const intentChart = makeStackedChart('intent-chart',
  makeDatasets(['positive', 'negative', 'none']));

const emotionStates = STATE_ORDER.filter(s => STATE_META[s].group === 'emotion');
const emotionChart = makeStackedChart('emotion-chart', makeDatasets(emotionStates));

const attentionStates = STATE_ORDER.filter(s => STATE_META[s].group === 'attention');
const attentionChart = makeStackedChart('attention-chart', makeDatasets(attentionStates));

// ====== 数据 → chart 渲染 ======
// gemini 钦定根因 1 修复：JS Number 精度上限 2^53 ≈ 9e15，但 ts_ns 是 19 位
// 直接 ts_ns / 1e6 触发精度坍塌 → chart 时间戳错乱 → x 轴静默卡死
// 解法：字符串截前 13 位即毫秒级（避开大数运算）
function safeNsToMs(ts_ns) {
  if (ts_ns == null) return Date.now();
  const str = String(ts_ns);
  if (str.length >= 13) {
    const ms = Number(str.slice(0, 13));
    return isNaN(ms) ? Date.now() : ms;
  }
  const val = Number(str);
  if (isNaN(val)) return Date.now();
  return val < 1e11 ? val * 1000 : val;
}

function normalizeGroup(probs, indices) {
  const subset = indices.map(i => probs[i]);
  const sum = subset.reduce((a, b) => a + b, 0) || 1;
  return subset.map(v => v / sum);
}

function rebuildChart(chart, allFrames, predFrames, kind) {
  // kind: 'intent' | 'emotion' | 'attention'
  let stateNames, getProbs;
  if (kind === 'intent') {
    stateNames = ['positive', 'negative', 'none'];
    getProbs = (frame) => frame.intent_probs || [0, 0, 0];
  } else if (kind === 'emotion') {
    stateNames = emotionStates;
    const indices = emotionStates.map(s => STATE_ORDER.indexOf(s));
    getProbs = (frame) => {
      if (!frame.state_probs) return stateNames.map(_ => 0);
      return normalizeGroup(frame.state_probs, indices);
    };
  } else {
    stateNames = attentionStates;
    const indices = attentionStates.map(s => STATE_ORDER.indexOf(s));
    getProbs = (frame) => {
      if (!frame.state_probs) return stateNames.map(_ => 0);
      return normalizeGroup(frame.state_probs, indices);
    };
  }

  const all = [...allFrames, ...predFrames];
  // 重建 datasets data（追加模式：每个 dataset push 新点）
  chart.data.datasets.forEach((ds, i) => {
    ds.data = all.map(f => ({
      x: new Date(safeNsToMs(f.ts_ns)),
      y: getProbs(f)[i] || 0,
    }));
  });
  // 注意：chart.update() 在 refreshAllCharts 末尾统一调，不在 rebuildChart 里
  // 避免 setNowAnnotation 跑两遍 / canvas 重画两遍
}

function setNowAnnotation(chart) {
  // 川哥钦定：'现在' 居于图正中 (1:1 分历史/预测)
  if (dataBuf.history.length === 0) return;
  const lastHistTs = safeNsToMs(dataBuf.history[dataBuf.history.length - 1].ts_ns);
  const rawLastPredTs = dataBuf.predictions.length > 0
    ? safeNsToMs(dataBuf.predictions[dataBuf.predictions.length - 1].ts_ns)
    : lastHistTs + 10000;
  // codex 钦定根因 1 修复：prediction 5s 一次推送，但 history 每秒前进
  // → lastPredTs 可能 ≤ lastHistTs（过期）→ predDurationMs ≤ 0 → x 轴翻转卡死
  // 修：safePredTs 至少 lastHistTs + 1s；predDurationMs 至少 1000ms
  const safePredTs = Number.isFinite(rawLastPredTs)
    ? Math.max(rawLastPredTs, lastHistTs + 1000)
    : lastHistTs + 10000;
  const predDurationMs = Math.max(1000, safePredTs - lastHistTs);
  const xMinMs = lastHistTs - predDurationMs;
  const xMaxMs = lastHistTs + predDurationMs;  // 对称：保证 1:1 居中

  // 强制 x 轴 1:1 比例
  chart.options.scales.x.min = xMinMs;
  chart.options.scales.x.max = xMaxMs;

  chart.options.plugins.annotation.annotations = {
    // 左半部分背景 (淡蓝灰，标记"历史"区)
    historyBox: {
      type: 'box',
      xMin: xMinMs, xMax: lastHistTs,
      backgroundColor: 'rgba(100, 116, 139, 0.05)',
      borderWidth: 0,
      drawTime: 'beforeDatasetsDraw',
    },
    // 右半部分背景 (浅黄，标记"预测"区)
    // cc 5/26 复盘：之前误用未声明 lastPredTs → 非 strict 下 window.lastPredTs=undefined，
    // 让 futureBox xMax 变成 NaN，annotation plugin 静默坏（不影响数据但 UI 错乱）
    futureBox: {
      type: 'box',
      xMin: lastHistTs, xMax: xMaxMs,
      backgroundColor: 'rgba(251, 191, 36, 0.12)',
      borderWidth: 0,
      drawTime: 'beforeDatasetsDraw',
    },
    // "现在" 红色垂直分割线
    nowLine: {
      type: 'line',
      xMin: lastHistTs, xMax: lastHistTs,
      borderColor: '#ef4444',
      borderWidth: 2.5,
      borderDash: [6, 3],
      label: {
        display: true,
        content: '⏱ 现在',
        position: 'start',
        backgroundColor: 'rgba(239, 68, 68, 0.9)',
        color: '#fff',
        font: { size: 11, weight: 'bold' },
        padding: 4,
      },
    },
    // 历史 / 预测 label 已迁出 chart annotation，改用 HTML overlay (DOM .now-label)
    // 由 syncHtmlNowLabels(chart) 在 refreshAllCharts 末尾同步位置
    // chart annotation v3 的 label clip:false + drawTime:afterDraw 实测仍被遮挡，弃用
  };
}

// HTML overlay 同步：每帧把 .now-label.history / .now-label.future 定位到"现在"虚线左右两侧
// chart.chartArea 是 chart.js v4 暴露的 plot area 像素坐标（CSS px），left/right 是 plot 左右边界
function syncHtmlNowLabels(chart) {
  const area = chart.chartArea;
  if (!area || area.right == null || area.left == null) return;
  const canvas = chart.canvas;
  const wrap = canvas.parentElement;
  if (!wrap) return;
  const histLabel = wrap.querySelector('.now-label.history');
  const futLabel = wrap.querySelector('.now-label.future');
  if (!histLabel || !futLabel) return;
  // "现在"虚线在 plot area 正中点（setNowAnnotation 强制 1:1 居中）
  const nowX = (area.left + area.right) / 2;
  // 历史 label 右对齐到 nowX-6（虚线左侧 6px 处）
  histLabel.style.left = (nowX - 6) + 'px';
  histLabel.style.transform = 'translateX(-100%)';  // 右对齐：label 右边缘对齐 left:nowX-6
  histLabel.style.display = 'block';
  // 预测 label 左对齐到 nowX+6（虚线右侧 6px 处）
  futLabel.style.left = (nowX + 6) + 'px';
  futLabel.style.transform = 'none';
  futLabel.style.display = 'block';
}

let _annotationFailedOnce = false;
let _chartUpdateCount = 0;

// rAF 节流：onmessage 只调 scheduleRefresh()，多个 event 自然合并到下一帧统一画
// 修复 2026-05-26 21:30 川哥反馈：ADR-036 让 prediction 5s→1s 后客户端 backlog
// 每秒积压 0.7 event（770ms/event 处理太慢）→ lag 线性增长。
// rAF 节流让 chart.update 跑在 16ms 一帧，多 event 合并 → 永不 backlog
let _refreshScheduled = false;
function scheduleRefresh() {
  if (_refreshScheduled) return;  // 已 schedule，多个 event 合并
  _refreshScheduled = true;
  requestAnimationFrame(() => {
    _refreshScheduled = false;
    refreshAllCharts();
  });
}

function refreshAllCharts() {
  try {
    rebuildChart(intentChart, dataBuf.history, dataBuf.predictions, 'intent');
    rebuildChart(emotionChart, dataBuf.history, dataBuf.predictions, 'emotion');
    rebuildChart(attentionChart, dataBuf.history, dataBuf.predictions, 'attention');
  } catch (e) {
    dlog(`❌ rebuildChart 失败: ${e.message}`, 'err');
    return;
  }
  [intentChart, emotionChart, attentionChart].forEach(c => {
    try { setNowAnnotation(c); } catch (e) {
      if (!_annotationFailedOnce) {
        dlog(`⚠️ setNowAnnotation 失败: ${e.message}`, 'warn');
        _annotationFailedOnce = true;
      }
    }
    try { c.update('none'); } catch (e) {
      dlog(`❌ chart.update 失败: ${e.message}`, 'err');
    }
    // chart.update 后 chartArea 已重算，立刻同步 HTML overlay label 位置
    try { syncHtmlNowLabels(c); } catch (e) { /* silent */ }
  });
  _chartUpdateCount++;
  // 显示在 frame-pill 之后，让川哥看到 chart 真在重画
  const cuPill = document.getElementById('chart-updates-pill');
  if (cuPill) cuPill.textContent = `redraws: ${_chartUpdateCount}`;
  // 防御性诊断：每 30 次 redraw 报一次最新 lnn frame 时间，让川哥/cc 一眼看 chart 是否真活
  if (_chartUpdateCount % 30 === 0 && dataBuf.history.length > 0) {
    const lastMs = safeNsToMs(dataBuf.history[dataBuf.history.length - 1].ts_ns);
    const lag = Date.now() - lastMs;
    dlog(`📊 redraws=${_chartUpdateCount} lastFrame=${new Date(lastMs).toLocaleTimeString()} lag=${(lag/1000).toFixed(1)}s`, lag > 5000 ? 'warn' : 'info');
  }
}

// ====== FPS 计数 ======
let frameCount = 0;
let lastFpsTime = Date.now();
setInterval(() => {
  const now = Date.now();
  const fps = (frameCount * 1000 / (now - lastFpsTime)).toFixed(1);
  document.getElementById('fps-pill').textContent = `${fps} fps`;
  frameCount = 0;
  lastFpsTime = now;
}, 1000);

// ====== SSE 客户端 v2.0：fetch + ReadableStream（替换 EventSource）======
// 川哥 2026-05-26 钦定方案 B（Team 模式 cc+codex+gemini 联合评估）
// 替换理由（gemini 3.5-flash 高 thinking 给出的 5 个深层根因）：
//   1. EventSource 黑盒：浏览器 SSE 实现底层有 HTTP/1.1 连接池上限、TCP window 锁死等
//      不可控的死锁路径；用 fetch 我们能完全掌控 reader 生命周期、AbortController 主动超时
//   2. 心跳盲区：onmessage 同步成功 → _lastMessageTime 更新 → 实际渲染 rAF 被静默丢
//      → 心跳假活。改成 reader.read() 主动 await（loop 自己暴露），任何 hang 都立即可见
//   3. 6 个 HTTP/1.1 连接上限：close() 进 TIME_WAIT 不释放，重连几次后池满 silent pending
//      → 用 AbortController 主动 abort 立即释放底层 socket
// 数据格式不变（SSE 协议帧 "data: <json>\n\n"），服务端无需改动。

let _currentAbortCtrl = null;
let _lastMessageTime = Date.now();
let _connectGen = 0;  // 每次重连递增，旧 reader 检测到 gen 失配立即退出
const STALE_THRESHOLD_MS = 10000;
const HEALTH_PROBE_INTERVAL_MS = 30000;  // 30s 主动 ping /health 验证 daemon 真活

function processFrame(rawData) {
  // 完全沿用旧 onmessage 内部逻辑，rawData 是 "data:" 后面的 JSON 字符串
  try {
    const msg = JSON.parse(rawData);
    if (!msg || !msg.type) return;
    if (msg.type === 'frame') {
      const lnn = msg.lnn || {};
      if (!Number.isFinite(msg.ts_ns)) {
        dlog(`⚠️ frame.ts_ns 非法（${msg.ts_ns}），丢弃`, 'warn');
        return;
      }
      if (!Array.isArray(lnn.state_probs) || lnn.state_probs.length !== 8) {
        lnn.state_probs = [0,0,0,0,0,0,0,0];
      }
      dataBuf.history.push({
        ts_ns: msg.ts_ns,
        state_probs: lnn.state_probs,
        intent_probs: lnn.intent_probs || [0,0,0],
        predicted_state: lnn.predicted_state || 'unknown',
      });
      if (dataBuf.history.length > HISTORY_FRAMES) dataBuf.history.shift();
      document.getElementById('frame-pill').textContent = `frame: ${msg.frame_id || '-'}`;
      if (lnn.ckpt_sha8) {
        document.getElementById('ckpt-pill').textContent = `ckpt: ${lnn.ckpt_sha8}`;
      }
      frameCount++;
      scheduleRefresh();  // rAF 节流：多 event 合并到下一帧统一画
    } else if (msg.type === 'prediction') {
      const preds = msg.predictions || [];
      const lastTs = dataBuf.history.length > 0
        ? dataBuf.history[dataBuf.history.length - 1].ts_ns
        : Date.now() * 1e6;
      // ADR-038 §F4: SSE prediction 携带 time_warp + feedback_paused
      const warp = Number(msg.time_warp || 1.0);
      const dtNs = 1e9 * warp;  // 模拟时间步长
      dataBuf.predictions = preds.slice(0, PRED_FRAMES).map((p, i) => ({
        ts_ns: lastTs + (i + 1) * dtNs,
        state_probs: p.state_probs || [0,0,0,0,0,0,0,0],
        intent_probs: p.intent_probs || [0,0,0],
        predicted_state: p.predicted_state || 'unknown',
        sim_seconds: p.sim_seconds || (i + 1) * warp,
      }));
      // 同步 UI 状态 pills
      const pausedPill = document.getElementById('warp-state-pill');
      const simPill = document.getElementById('sim-time-pill');
      const simVal = document.getElementById('sim-time-val');
      if (warp >= 10.0) {
        pausedPill.style.display = '';
        simPill.style.display = '';
        const totalSim = PRED_FRAMES * warp;
        simVal.textContent = totalSim >= 60
          ? `${(totalSim / 60).toFixed(1)} 分钟`
          : `${totalSim.toFixed(0)} 秒`;
      } else {
        pausedPill.style.display = 'none';
        simPill.style.display = 'none';
      }
      scheduleRefresh();  // rAF 节流：多 event 合并到下一帧统一画
    }
    // 心跳放在末尾：onmessage 同步部分跑完即算"真活"（不必等 rAF 渲染）
    _lastMessageTime = Date.now();
  } catch (err) {
    console.error('parse/render SSE msg failed:', err, rawData?.slice(0, 200));
    dlog(`❌ processFrame 异常: ${err.message}`, 'err');
    // 不更新 _lastMessageTime → 心跳触发重连
  }
}

async function connect() {
  const myGen = ++_connectGen;
  const statusEl = document.getElementById('conn-status');

  // 关旧连接（abort 立即释放底层 socket，绕过 TIME_WAIT 6 连接上限）
  if (_currentAbortCtrl) {
    try { _currentAbortCtrl.abort(); } catch(e) {}
  }
  const ctrl = new AbortController();
  _currentAbortCtrl = ctrl;
  _lastMessageTime = Date.now();

  dlog(`📡 fetch SSE stream (gen=${myGen}) ${SSE_URL}...`);
  statusEl.className = 'status-pill';
  statusEl.textContent = '🔄 连接中...';

  let resp;
  try {
    resp = await fetch(SSE_URL, {
      method: 'GET',
      headers: { 'Accept': 'text/event-stream', 'Cache-Control': 'no-cache' },
      signal: ctrl.signal,
      // 关键：禁掉浏览器 keepalive 复用池，强制新 TCP 连接（避开 6 上限假死）
      cache: 'no-store',
    });
  } catch (err) {
    if (myGen !== _connectGen) return;  // 已被新 connect() 取代
    statusEl.className = 'status-pill err';
    statusEl.textContent = '❌ fetch 失败';
    dlog(`❌ fetch 失败 (gen=${myGen}): ${err.message}`, 'err');
    return;
  }

  if (!resp.ok) {
    statusEl.className = 'status-pill err';
    statusEl.textContent = `❌ HTTP ${resp.status}`;
    dlog(`❌ HTTP ${resp.status} ${resp.statusText}`, 'err');
    return;
  }

  statusEl.className = 'status-pill ok';
  statusEl.textContent = '✅ 已连接 (fetch v2)';
  dlog(`✅ SSE stream opened (gen=${myGen})`, 'ok');
  _lastMessageTime = Date.now();

  const reader = resp.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buffer = '';
  let msgCount = 0;

  try {
    while (myGen === _connectGen) {
      const { value, done } = await reader.read();
      if (done) {
        dlog(`⚠️ stream done (gen=${myGen})，5s 后重连`, 'warn');
        break;
      }
      buffer += decoder.decode(value, { stream: true });
      // SSE 帧分隔符：\n\n（或 \r\n\r\n）
      let sepIdx;
      while ((sepIdx = buffer.indexOf('\n\n')) !== -1) {
        const rawEvent = buffer.slice(0, sepIdx);
        buffer = buffer.slice(sepIdx + 2);
        // rawEvent 可能是多行（"data: xxx\ndata: yyy"），但 daemon 单行 → 取 "data: "
        const lines = rawEvent.split('\n');
        let dataPayload = '';
        for (const line of lines) {
          if (line.startsWith('data: ')) dataPayload += line.slice(6);
          else if (line.startsWith('data:')) dataPayload += line.slice(5);
          // 注释行（": heartbeat"）忽略；只更心跳时间
        }
        if (rawEvent.startsWith(':')) {
          _lastMessageTime = Date.now();  // server 心跳
          continue;
        }
        if (!dataPayload) continue;
        msgCount++;
        if (msgCount <= 3) dlog(`📨 收到 #${msgCount} (${dataPayload.length}B)`, 'ok');
        if (msgCount === 5) dlog('（之后不再 log 单帧，看 fps pill）', 'info');
        processFrame(dataPayload);
      }
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      dlog(`🔌 stream aborted (gen=${myGen})`, 'info');
      return;
    }
    statusEl.className = 'status-pill err';
    statusEl.textContent = '❌ stream error';
    dlog(`❌ reader 异常 (gen=${myGen}): ${err.message}`, 'err');
  } finally {
    try { reader.releaseLock(); } catch(e) {}
  }

  // 自动重连（如果还是当前 gen）
  if (myGen === _connectGen) {
    statusEl.className = 'status-pill err';
    statusEl.textContent = '❌ 断开重连中...';
    setTimeout(() => { if (myGen === _connectGen) connect(); }, 1000);
  }
}

dlog('🚀 调用 connect() [fetch v2]...');
connect().catch(e => dlog(`❌ connect() 顶层 reject: ${e.message}`, 'err'));

// ADR-038 §F4: 时间曲率 select → POST /control/time_warp
(function bindTimeWarpControl() {
  const sel = document.getElementById('time-warp-select');
  if (!sel) return;
  sel.addEventListener('change', async () => {
    const warp = Number(sel.value);
    dlog(`⏱ 切换时间曲率 → ${warp}× (${warp >= 10 ? 'RL 反馈窗口将暂停' : '实时模式'})`);
    try {
      const resp = await fetch('/control/time_warp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ time_warp: warp }),
      });
      if (!resp.ok) {
        dlog(`⚠️ time_warp 切换失败: HTTP ${resp.status}`, 'warn');
        return;
      }
      const data = await resp.json();
      dlog(`✅ time_warp ${data.old_time_warp || '?'} → ${data.new_time_warp}, paused=${data.feedback_paused}`);
    } catch (err) {
      dlog(`❌ time_warp 切换异常: ${err.message}`, 'err');
    }
  });
})();

// 心跳监控：5s 一次，> 10s 没数据 → abort + 重连
setInterval(() => {
  const age = Date.now() - _lastMessageTime;
  if (age > STALE_THRESHOLD_MS) {
    dlog(`⚠️ SSE 僵死 ${(age/1000).toFixed(0)}s 没数据，abort 重连`, 'warn');
    try { _currentAbortCtrl?.abort(); } catch(e) {}
    connect().catch(e => dlog(`重连失败: ${e.message}`, 'err'));
  }
}, 5000);

// 主动健康探针：每 30s ping /health，验证 daemon 真活（独立 SSE 链路之外）
setInterval(async () => {
  try {
    const r = await fetch('/health', { cache: 'no-store' });
    if (!r.ok) dlog(`⚠️ /health HTTP ${r.status}`, 'warn');
  } catch (err) {
    dlog(`⚠️ /health 探针失败: ${err.message}（daemon 可能挂了）`, 'warn');
  }
}, HEALTH_PROBE_INTERVAL_MS);

// 窗口 resize 时立即同步 HTML overlay label 位置（不等下一帧 SSE）
window.addEventListener('resize', () => {
  [intentChart, emotionChart, attentionChart].forEach(c => {
    try { syncHtmlNowLabels(c); } catch(e) {}
  });
});

// 页面可见性变化：从后台回前台时立即检查 + 重连
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    const age = Date.now() - _lastMessageTime;
    dlog(`👁 页面回到前台（${(age/1000).toFixed(0)}s 没数据）`, 'info');
    if (age > 3000) {
      try { _currentAbortCtrl?.abort(); } catch(e) {}
      connect().catch(e => dlog(`回前台重连失败: ${e.message}`, 'err'));
    }
  }
});

// canvas context lost 监听（gemini 钦定根因 3：高 CPU 下 OS 回收显存让画图变 no-op）
['intent-chart','emotion-chart','attention-chart'].forEach(id => {
  const cvs = document.getElementById(id);
  if (!cvs) return;
  cvs.addEventListener('webglcontextlost', (e) => {
    dlog(`🚨 canvas ${id} contextlost！自动 reload 页面`, 'err');
    e.preventDefault();
    setTimeout(() => location.reload(), 500);
  });
  cvs.addEventListener('contextlost', (e) => {
    dlog(`🚨 canvas ${id} 2D contextlost！自动 reload`, 'err');
    setTimeout(() => location.reload(), 500);
  });
});
</script>
